services:
  stocktrack-api:
    labels:
      - wud.watch=false
      - com.centurylinklabs.watchtower.enable=false
    build: ./backend
    env_file: .env
    volumes:
      - stocktrack-data:/data
    expose:
      - "9180"
    # The API has no authentication — publishing it on the host bypasses the
    # nginx proxy entirely. Uncomment only for local debugging.
    # ports:
    #   - "9180:9180"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9180/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  stocktrack-ui:
    labels:
      - wud.watch=false
      - com.centurylinklabs.watchtower.enable=false
    build: ./frontend
    environment:
      # Reverse proxies whose X-Forwarded-For entry nginx trusts for the
      # real client IP (space separated addresses or CIDRs). See .env.example.
      REAL_IP_FROM: ${REAL_IP_FROM:-}
    ports:
      - "${FRONTEND_PORT:-9181}:80"
    depends_on:
      stocktrack-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stocktrack-data:
