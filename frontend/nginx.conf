server {
    listen 80;
    server_name _;

    # Real client IP. Behind the HTTPS reverse proxy every request arrives
    # from the proxy's address, so without this $remote_addr (and the entry
    # appended to X-Forwarded-For below, which the API's rate limiter keys on,
    # right most entry only) is the proxy for every browser and they all
    # share one login and setup rate limit bucket. The snippet is written at
    # container start from REAL_IP_FROM (docker-entrypoint.d/40-stocktrack-real-ip.sh):
    # set_real_ip_from for each trusted proxy, real_ip_header X-Forwarded-For
    # and real_ip_recursive off, so only the entry the trusted proxy appended
    # is used. The ranges are not written here because they are deployment
    # specific (and this repo refuses private address literals). Empty when
    # REAL_IP_FROM is unset: $remote_addr stays the TCP peer.
    include /etc/nginx/stocktrack/*.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://stocktrack-api:9180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Manual checks can be slow server-side: the fetch layer tries up to
        # 6 impersonation targets x 30s on bot-wall statuses, some stores add
        # a second POST, and Gotify retries back off. 60s produced spurious
        # 504 "Check failed" responses for checks that then succeeded.
        proxy_read_timeout 300s;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite content-hashes them)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Disable access logs for health pings (reduce noise)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
